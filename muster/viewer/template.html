<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulator replay</title>
<style>
  :root {
    --bg:#0e1116; --panel:#11161d; --border:#232c38; --raised:#1c2530;
    --text:#c9d4df; --dim:#8b98a5; --blue:#35a7ff; --red:#ff4d5f; --gold:#ffc440;
  }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; overscroll-behavior:none; background:var(--bg); color:var(--text); font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  body { display:flex; flex-direction:column; }
  #top,#dock { display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--panel); }
  #top { border-bottom:1px solid var(--border); }
  #dock { border-top:1px solid var(--border); }
  #brand { display:inline-flex; align-items:center; gap:7px; font-weight:600; letter-spacing:-.02em; color:var(--text); font-size:14px; user-select:none; }
  #runsLink,#chartsLink { font:600 12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--dim); text-decoration:none; padding:3px 2px; border-bottom:1px solid transparent; }
  #runsLink:hover,#chartsLink:hover { color:var(--text); border-bottom-color:var(--dim); }
  kbd { font:600 10px ui-monospace,monospace; color:var(--dim); border:1px solid var(--border); border-bottom-width:2px; border-radius:2px; padding:0 4px; margin-left:5px; }
  button,select { font:inherit; color:var(--dim); background:transparent; border:1px solid var(--border); border-radius:2px; padding:4px 10px; cursor:pointer; white-space:nowrap; }
  button:hover,select:hover { color:var(--text); border-color:#38455a; }
  select,option { background:#151b23; color:var(--text); }
  button.on { color:var(--text); background:var(--raised); border-color:#3d4c5e; }
  #play { width:36px; text-align:center; padding:4px 0; color:var(--text); }
  #current.fresh { color:var(--gold); border-color:#5a4a22; }
  #update { white-space:nowrap; color:var(--dim); }
  #matchup { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #spacer { flex:1; }
  .chip { white-space:nowrap; padding:3px 4px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .chip.blue { color:var(--blue); }
  .chip.red { color:var(--red); }
  #scorebar { display:flex; height:5px; background:#1d242e; transition:opacity .2s; }
  #scorebar.off { opacity:.25; }
  #scoreBlue { background:var(--blue); width:0; transition:width .25s linear; }
  #scoreRed { background:var(--red); width:0; margin-left:auto; transition:width .25s linear; }
  #frame { flex:1; min-width:60px; appearance:none; -webkit-appearance:none; height:20px; background:transparent; cursor:pointer; }
  #frame::-webkit-slider-runnable-track { height:3px; background:var(--border); }
  #frame::-webkit-slider-thumb { -webkit-appearance:none; width:5px; height:15px; margin-top:-6px; background:var(--text); border:none; border-radius:1px; }
  #frame::-moz-range-track { height:3px; background:var(--border); }
  #frame::-moz-range-thumb { width:5px; height:15px; background:var(--text); border:none; border-radius:1px; }
  #time { color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  canvas { display:block; flex:1; min-height:0; width:100%; touch-action:none; }
  #inspect { position:fixed; right:10px; top:48px; background:rgba(17,22,29,.92); border:1px solid var(--border); border-left:3px solid var(--dim); padding:6px 10px; border-radius:2px; pointer-events:none; z-index:5; }
  #inspect.blue { border-left-color:var(--blue); }
  #inspect.red { border-left-color:var(--red); }
  @media (max-width:700px), (pointer:coarse) {
    #top,#dock { gap:5px; padding:5px 6px; }
    #frame { min-width:24px; }
    #brand,#time,#trails,#delta { display:none; }
    button,select { padding:3px 6px; font-size:12px; }
    .chip { padding:2px 6px; }
  }
</style>
<div id="top">
  <span id="brand"><svg width="18" height="16" viewBox="0 0 22 20" aria-hidden="true"><path d="M6 1.3 10.5 3.9v5.2L6 11.7 1.5 9.1V3.9Z" fill="#35a7ff"/><path d="M16 1.3 20.5 3.9v5.2L16 11.7 11.5 9.1V3.9Z" fill="#ff4d5f"/><path d="M11 8.3 15.5 10.9v5.2L11 18.7 6.5 16.1v-5.2Z" fill="#3a4658"/></svg>muster</span>
  <a id="runsLink" href="/runs.html">runs</a>
  <a id="chartsLink" href="/charts.html">charts</a>
  <span id="update"><label for="updates">update</label> <select id="updates"></select></span>
  <button id="current">load current</button>
  <span id="matchup"></span>
  <span id="spacer"></span>
  <span class="chip blue" id="chip0">●</span>
  <span class="chip red" id="chip1">●</span>
  <span class="chip" id="delta"></span>
</div>
<div id="scorebar"><div id="scoreBlue"></div><div id="scoreRed"></div></div>
<canvas id="world"></canvas>
<div id="dock">
  <button id="play">❚❚</button>
  <span id="time"></span>
  <input id="frame" type="range" min="0" value="0" step="any">
  <select id="speed"><option value=".25">0.25x</option><option value=".5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option></select>
  <button id="territory" class="on">territory<kbd>T</kbd></button>
  <button id="trails">trails<kbd>R</kbd></button>
</div>
<div id="inspect" hidden></div>
<script>
const replay=__REPLAY__, cfg=replay.config, teams=replay.team;
const mobile=matchMedia("(pointer:coarse)").matches||innerWidth<=700;
const maxDpr=mobile?1:2, targetFrameMs=1000/(mobile?20:30);
function decode(text,Type) {
  const raw=atob(text), bytes=new Uint8Array(raw.length);
  for (let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
  return new Type(bytes.buffer);
}
const positions=decode(replay.position_u16,Uint16Array);
const angles=decode(replay.angle_i16,Int16Array);
const healths=decode(replay.health_u16,Uint16Array);
const territoryOwners=replay.territory_i8?decode(replay.territory_i8,Int8Array):null;
const controlShares=replay.control_u8?decode(replay.control_u8,Uint8Array):null;
delete replay.position_u16; delete replay.angle_i16; delete replay.health_u16; delete replay.territory_i8; delete replay.control_u8;
const frameCount=replay.frame_count, soldierCount=teams.length, lastFrame=frameCount-1;
const quantizedMax=65535, angleScale=Math.PI/32767;
const canvas=document.querySelector("#world"), ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
const current=document.querySelector("#current");
const slider=document.querySelector("#frame"), play=document.querySelector("#play");
const speed=document.querySelector("#speed"), timeText=document.querySelector("#time");
const update=document.querySelector("#update"), updates=document.querySelector("#updates");
const matchup=document.querySelector("#matchup");
const territoryButton=document.querySelector("#territory");
const scorebar=document.querySelector("#scorebar");
const scoreBlue=document.querySelector("#scoreBlue"), scoreRed=document.querySelector("#scoreRed");
const chip0=document.querySelector("#chip0"), chip1=document.querySelector("#chip1");
const deltaChip=document.querySelector("#delta");
const hexRadius=cfg.territory_radius||0, hexArena=cfg.arena_shape==="hex";
const territoryWidth=cfg.territory_width||32, territoryHeight=cfg.territory_height||18;
const territoryCells=hexRadius?cfg.territory_cells:territoryWidth*territoryHeight;
const strongpointCells=Array.isArray(cfg.strongpoint_cells)?cfg.strongpoint_cells:[];
const strongpointWeight=cfg.strongpoint_weight||1;
// Per-team score weights. Under assault scoring each team scores only on
// the ENEMY base (own base weight 0); legacy replays weight strongpoints
// symmetrically. The winner is the sign of the TIME-INTEGRAL of the
// weighted advantage, so both the level and the integral are shown.
const teamBaseCells=Array.isArray(cfg.team_base_cells)?cfg.team_base_cells:null;
const scoreW0=new Float32Array(territoryCells).fill(1);
const scoreW1=new Float32Array(territoryCells).fill(1);
if (teamBaseCells) {
  for (const cell of teamBaseCells[1]) scoreW0[cell]=strongpointWeight;
  for (const cell of teamBaseCells[0]) scoreW0[cell]=0;
  for (const cell of teamBaseCells[0]) scoreW1[cell]=strongpointWeight;
  for (const cell of teamBaseCells[1]) scoreW1[cell]=0;
} else for (const cell of strongpointCells) { scoreW0[cell]=strongpointWeight; scoreW1[cell]=strongpointWeight; }
let scoreTotal=0;
for (let cell=0;cell<territoryCells;cell++) scoreTotal+=scoreW0[cell];
const territoryTotalWeight=scoreTotal;
const hexSize=cfg.hex_size||cfg.world_width/(3*hexRadius+2);
const territoryHexes=[];
if (Array.isArray(cfg.territory_axial)) territoryHexes.push(...cfg.territory_axial);
else if (hexRadius) for (let q=-hexRadius;q<=hexRadius;q++) {
  const first=Math.max(-hexRadius,-q-hexRadius), last=Math.min(hexRadius,-q+hexRadius);
  for (let r=first;r<=last;r++) territoryHexes.push([q,r]);
}
const territoryDensity=new Float32Array(2*territoryCells);
const territoryCanvas=document.createElement("canvas"), territoryContext=territoryCanvas.getContext("2d",{desynchronized:true});
const territoryFrame=new Uint16Array(frameCount);
if (controlShares) for (let frame=1;frame<frameCount;frame++) {
  let changed=false, base=frame*territoryCells*2, previousBase=base-territoryCells*2;
  for (let i=0;i<territoryCells*2&&!changed;i++) changed=controlShares[base+i]!==controlShares[previousBase+i];
  territoryFrame[frame]=changed?frame:territoryFrame[frame-1];
}
else if (territoryOwners) for (let frame=1;frame<frameCount;frame++) {
  let changed=false, base=frame*territoryCells, previousBase=base-territoryCells;
  for (let cell=0;cell<territoryCells&&!changed;cell++) changed=territoryOwners[base+cell]!==territoryOwners[previousBase+cell];
  territoryFrame[frame]=changed?frame:territoryFrame[frame-1];
}
// Running mean of the weighted advantage: the number whose final sign IS
// the winner (the level alone can disagree with the verdict at the end).
const meanAdvantage=(controlShares||territoryOwners)?new Float32Array(frameCount):null;
if (meanAdvantage) {
  let accumulated=0;
  for (let frame=1;frame<frameCount;frame++) {
    let advantage=0;
    if (controlShares) {
      const base=frame*territoryCells*2;
      for (let cell=0;cell<territoryCells;cell++)
        advantage+=scoreW0[cell]*controlShares[base+cell*2]-scoreW1[cell]*controlShares[base+cell*2+1];
      advantage/=255*scoreTotal;
    } else {
      const base=frame*territoryCells;
      for (let cell=0;cell<territoryCells;cell++) {
        const owner=territoryOwners[base+cell];
        if (owner===0) advantage+=scoreW0[cell]; else if (owner===1) advantage-=scoreW1[cell];
      }
      advantage/=scoreTotal;
    }
    accumulated+=advantage;
    meanAdvantage[frame]=accumulated/frame;
  }
}
const screenState=new Float32Array(soldierCount*4);
const deathFrame=new Uint16Array(soldierCount).fill(65535);
const deathX=new Float32Array(soldierCount), deathY=new Float32Array(soldierCount);
for (let i=0;i<soldierCount;i++) for (let f=1;f<frameCount;f++) {
  if (healths[f*soldierCount+i]===0 && healths[(f-1)*soldierCount+i]>0) {
    deathFrame[i]=f;
    deathX[i]=positions[(f*soldierCount+i)*2]*cfg.world_width/quantizedMax;
    deathY[i]=positions[(f*soldierCount+i)*2+1]*cfg.world_height/quantizedMax;
    break;
  }
}
const perceptionRadius=cfg.entity_radius||5;
let zoom=1, camX=cfg.world_width/2, camY=cfg.world_height/2;
let showTrails=false, selected=-1;
let viewLeft=0, viewBottom=0, viewScale=1, viewBase=1, viewDpr=1;
const trailsButton=document.querySelector("#trails");
const inspect=document.querySelector("#inspect");
let cursor=0, playing=lastFrame>0, showTerritory=true, previous=performance.now();
let dirty=true, lastDraw=0, animationRequest=0, territoryKey="", territoryText="";
let scoreShare0=0, scoreShare1=0, scoreKey="";
let territoryGeometryKey="", territoryBoard=null, territoryPaths=[];
slider.max=lastFrame;

function setText(element,value) { if (element.textContent!==value) element.textContent=value; }

function setMatchup() {
  if (!Number.isInteger(replay.learner_team)||!replay.opponent_mode) { matchup.hidden=true; return; }
  const opponent={nearest:"nearest-charge",pool:"policy-pool",self:"current-policy"}[replay.opponent_mode]||replay.opponent_mode;
  const roles=[opponent,opponent]; roles[replay.learner_team]="learner";
  if (Number.isInteger(replay.learner_mode)) roles[replay.learner_team]+=mobile?"·m"+replay.learner_mode:" (mode "+replay.learner_mode+")";
  const text=mobile?"B "+roles[0]+" · R "+roles[1]:"blue "+roles[0]+" vs red "+roles[1];
  setText(matchup,text); document.title="Muster · "+text;
}
setMatchup();

function setUpdateChoices(values) {
  if (!Number.isInteger(replay.update)) { update.hidden=true; return; }
  values=[...new Set(values.filter(Number.isInteger).concat(replay.update))].sort((a,b)=>b-a);
  updates.replaceChildren(...values.map(value=>{
    const option=document.createElement("option"); option.value=value; option.textContent=value;
    option.selected=value===replay.update; return option;
  }));
}
setUpdateChoices([]);
let latestUpdate=Number.isInteger(replay.update)?replay.update:null;
function refreshUpdates() {
  // Relative fetch: every published replay sits beside its run's manifest,
  // whether reached via /replays/ or /runs/<run>/replays/.
  fetch("manifest.json",{cache:"no-store"})
    .then(response=>response.ok?response.json():Promise.reject())
    .then(manifest=>{
      setUpdateChoices(Array.isArray(manifest.updates)?manifest.updates:[]);
      if (typeof manifest.run==="string") document.querySelector("#chartsLink").href="/charts.html?run="+encodeURIComponent(manifest.run);
      if (Number.isInteger(manifest.current)) latestUpdate=manifest.current;
      if (Number.isInteger(manifest.current)&&manifest.current!==replay.update) {
        setText(current,(mobile?"current ":"load current ")+manifest.current);
        current.classList.add("fresh");
      }
    })
    .catch(()=>{});
}
refreshUpdates();
setInterval(refreshUpdates,10000);

function arenaPath(context,left,top,width,height) {
  context.beginPath(); context.moveTo(left+width*.5,top);
  context.lineTo(left+width,top+height*.25); context.lineTo(left+width,top+height*.75);
  context.lineTo(left+width*.5,top+height); context.lineTo(left,top+height*.75);
  context.lineTo(left,top+height*.25); context.closePath();
}

function appendTerritoryHex(context,hex,left,top,pixelWidth,pixelHeight) {
  const q=hex[0], r=hex[1];
  const size=hexSize;
  const x=left+(cfg.world_width*.5+1.5*size*q)*pixelWidth/cfg.world_width;
  const y=top+pixelHeight-(cfg.world_height*.5+Math.sqrt(3)*size*(r+.5*q))*pixelHeight/cfg.world_height;
  const rx=size*pixelWidth/cfg.world_width, ry=size*pixelHeight/cfg.world_height;
  for (let side=0;side<6;side++) {
    const angle=side*Math.PI/3, px=x+rx*Math.cos(angle), py=y-ry*Math.sin(angle);
    if (side===0) context.moveTo(px,py); else context.lineTo(px,py);
  }
  context.closePath();
}

function territoryHexPath(context,hex,pixelWidth,pixelHeight) {
  context.beginPath(); appendTerritoryHex(context,hex,0,0,pixelWidth,pixelHeight);
}

function territoryBoardPath(context,left,top,pixelWidth,pixelHeight) {
  context.beginPath();
  for (const hex of territoryHexes) appendTerritoryHex(context,hex,left,top,pixelWidth,pixelHeight);
}

function prepareTerritoryGeometry(pixelWidth,pixelHeight) {
  const key=pixelWidth+":"+pixelHeight;
  if (key===territoryGeometryKey) return;
  territoryGeometryKey=key; territoryBoard=null; territoryPaths=[];
  if (!hexRadius||typeof Path2D==="undefined") return;
  territoryBoard=new Path2D();
  for (const hex of territoryHexes) {
    appendTerritoryHex(territoryBoard,hex,0,0,pixelWidth,pixelHeight);
    const path=new Path2D(); appendTerritoryHex(path,hex,0,0,pixelWidth,pixelHeight);
    territoryPaths.push(path);
  }
}

function updateTerritory(frameIndex,pixelWidth,pixelHeight) {
  frameIndex=(controlShares||territoryOwners)?territoryFrame[frameIndex]:frameIndex;
  const key=frameIndex+":"+pixelWidth+":"+pixelHeight;
  if (key===territoryKey) return;
  territoryKey=key;
  territoryCanvas.width=pixelWidth; territoryCanvas.height=pixelHeight;
  prepareTerritoryGeometry(pixelWidth,pixelHeight);
  territoryContext.clearRect(0,0,pixelWidth,pixelHeight);
  territoryContext.save();
  if (hexRadius) {
    if (territoryBoard) territoryContext.clip(territoryBoard);
    else { territoryBoardPath(territoryContext,0,0,pixelWidth,pixelHeight); territoryContext.clip(); }
  }
  else if (hexArena) { arenaPath(territoryContext,0,0,pixelWidth,pixelHeight); territoryContext.clip(); }
  const cellWidth=pixelWidth/territoryWidth, cellHeight=pixelHeight/territoryHeight;
  if (controlShares) {
    let territory0=0, territory1=0;
    const base=frameIndex*territoryCells*2;
    for (let cell=0;cell<territoryCells;cell++) {
      const s0=controlShares[base+cell*2]/255, s1=controlShares[base+cell*2+1]/255;
      territory0+=scoreW0[cell]*s0; territory1+=scoreW1[cell]*s1;
      const claimed=s0+s1;
      if (claimed<0.02) continue;
      const r=Math.round((53*s0+255*s1)/claimed), g=Math.round((167*s0+77*s1)/claimed), b=Math.round((255*s0+95*s1)/claimed);
      const alpha=Math.min(0.42,0.05+0.4*Math.max(s0,s1)).toFixed(3);
      territoryContext.fillStyle="rgba("+r+","+g+","+b+","+alpha+")";
      if (hexRadius) {
        if (territoryPaths.length) territoryContext.fill(territoryPaths[cell]);
        else { territoryHexPath(territoryContext,territoryHexes[cell],pixelWidth,pixelHeight); territoryContext.fill(); }
      }
      else {
        const x=cell%territoryWidth, y=Math.floor(cell/territoryWidth);
        territoryContext.fillRect(x*cellWidth,pixelHeight-(y+1)*cellHeight,cellWidth+.5,cellHeight+.5);
      }
    }
    const advantage=(territory0-territory1)/territoryTotalWeight;
    scoreShare0=territory0/territoryTotalWeight; scoreShare1=territory1/territoryTotalWeight;
    territoryText="blue "+scoreShare0.toFixed(3)+" | red "+scoreShare1.toFixed(3)+" | delta "+(advantage>=0?"+":"")+advantage.toFixed(3);
    territoryContext.restore();
    return;
  }
  if (territoryOwners) {
    let territory0=0, territory1=0;
    const base=frameIndex*territoryCells;
    for (let cell=0;cell<territoryCells;cell++) {
      const owner=territoryOwners[base+cell];
      if (owner<0) continue;
      if (owner===0) territory0+=scoreW0[cell]; else territory1+=scoreW1[cell];
      if (!hexRadius) {
        territoryContext.fillStyle=owner===0?"rgba(53,167,255,.28)":"rgba(255,77,95,.28)";
        const x=cell%territoryWidth, y=Math.floor(cell/territoryWidth);
        territoryContext.fillRect(x*cellWidth,pixelHeight-(y+1)*cellHeight,cellWidth+.5,cellHeight+.5);
      }
    }
    if (hexRadius) for (let cell=0;cell<territoryCells;cell++) {
      const owner=territoryOwners[base+cell]; if (owner<0) continue;
      territoryContext.fillStyle=owner===0?"rgba(53,167,255,.28)":"rgba(255,77,95,.28)";
      if (territoryPaths.length) territoryContext.fill(territoryPaths[cell]);
      else { territoryHexPath(territoryContext,territoryHexes[cell],pixelWidth,pixelHeight); territoryContext.fill(); }
    }
    const advantage=(territory0-territory1)/territoryTotalWeight;
    scoreShare0=territory0/territoryTotalWeight; scoreShare1=territory1/territoryTotalWeight;
    territoryText="blue "+scoreShare0.toFixed(3)+" | red "+scoreShare1.toFixed(3)+" | delta "+(advantage>=0?"+":"")+advantage.toFixed(3);
    territoryContext.restore();
    return;
  }
  territoryDensity.fill(0);
  const frameBase=frameIndex*soldierCount;
  for (let i=0;i<soldierCount;i++) {
    const index=frameBase+i, strength=healths[index]/quantizedMax;
    if (strength<=0) continue;
    const positionX=positions[index*2]*cfg.world_width/quantizedMax;
    const positionY=positions[index*2+1]*cfg.world_height/quantizedMax;
    const gridX=Math.max(0,Math.min(territoryWidth-1,positionX*territoryWidth/cfg.world_width-.5));
    const gridY=Math.max(0,Math.min(territoryHeight-1,positionY*territoryHeight/cfg.world_height-.5));
    const x0=Math.floor(gridX), y0=Math.floor(gridY);
    const x1=Math.min(x0+1,territoryWidth-1), y1=Math.min(y0+1,territoryHeight-1);
    const fractionX=gridX-x0, fractionY=gridY-y0;
    const base=teams[i]*territoryCells;
    territoryDensity[base+y0*territoryWidth+x0]+=strength*(1-fractionX)*(1-fractionY);
    territoryDensity[base+y0*territoryWidth+x1]+=strength*fractionX*(1-fractionY);
    territoryDensity[base+y1*territoryWidth+x0]+=strength*(1-fractionX)*fractionY;
    territoryDensity[base+y1*territoryWidth+x1]+=strength*fractionX*fractionY;
  }

  let territory0=0, territory1=0;
  for (let y=0;y<territoryHeight;y++) for (let x=0;x<territoryWidth;x++) {
    let influence0=0, influence1=0;
    for (let offsetY=-1;offsetY<=1;offsetY++) {
      const otherY=y+offsetY; if (otherY<0 || otherY>=territoryHeight) continue;
      for (let offsetX=-1;offsetX<=1;offsetX++) {
        const otherX=x+offsetX; if (otherX<0 || otherX>=territoryWidth) continue;
        const weight=offsetX===0&&offsetY===0?4:offsetX===0||offsetY===0?2:1;
        const cell=otherY*territoryWidth+otherX;
        influence0+=weight*territoryDensity[cell];
        influence1+=weight*territoryDensity[territoryCells+cell];
      }
    }
    influence0*=.0625; influence1*=.0625;
    const presence=1-Math.exp(-(influence0+influence1)/.15);
    const difference=Math.max(-20,Math.min(20,(influence0-influence1)/.1));
    const share0=1/(1+Math.exp(-difference));
    const strategic=Math.sin(Math.PI*(x+.5)/territoryWidth)**2;
    const contribution=strategic*presence/(territoryCells*.5);
    territory0+=contribution*share0;
    territory1+=contribution*(1-share0);
    const alpha=.55*presence*strategic;
    if (alpha>.002) {
      const red=Math.round(53*share0+255*(1-share0));
      const green=Math.round(167*share0+77*(1-share0));
      const blue=Math.round(255*share0+95*(1-share0));
      territoryContext.fillStyle="rgba("+red+","+green+","+blue+","+alpha+")";
      territoryContext.fillRect(x*cellWidth,pixelHeight-(y+1)*cellHeight,cellWidth+.5,cellHeight+.5);
    }
  }
  const advantage=territory0-territory1;
  scoreShare0=Math.min(1,territory0); scoreShare1=Math.min(1,territory1);
  territoryText="blue "+territory0.toFixed(3)+" | red "+territory1.toFixed(3)+" | delta "+(advantage>=0?"+":"")+advantage.toFixed(3);
  territoryContext.restore();
}

function draw() {
  const dpr=Math.min(devicePixelRatio||1,maxDpr);
  const width=Math.max(1,Math.round(canvas.clientWidth*dpr));
  const height=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if (canvas.width!==width || canvas.height!==height) {
    canvas.width=width; canvas.height=height; ctx.imageSmoothingEnabled=false;
  }
  const margin=12*dpr, baseScale=Math.min((width-2*margin)/cfg.world_width,(height-2*margin)/cfg.world_height);
  const scale=baseScale*zoom;
  camX=Math.max(0,Math.min(cfg.world_width,camX)); camY=Math.max(0,Math.min(cfg.world_height,camY));
  const left=width/2-camX*scale, bottom=height/2+camY*scale, top=bottom-cfg.world_height*scale;
  viewLeft=left; viewBottom=bottom; viewScale=scale; viewBase=baseScale; viewDpr=dpr;
  const territoryScale=Math.min(scale,2048/cfg.world_width), geometryRatio=scale/territoryScale;
  const worldWidth=Math.max(1,Math.round(cfg.world_width*territoryScale));
  const worldHeight=Math.max(1,Math.round(cfg.world_height*territoryScale));
  if (hexRadius) prepareTerritoryGeometry(worldWidth,worldHeight);
  const lower=Math.min(Math.floor(cursor),lastFrame), upper=Math.min(lower+1,lastFrame), amount=cursor-lower;
  ctx.fillStyle="#0e1116"; ctx.fillRect(0,0,width,height);
  // The physical arena is bounded by straight walls that circumscribe the
  // jagged tile edge; draw that true floor so wall pockets read as board
  // margin rather than soldiers escaping the world.
  if (Array.isArray(cfg.arena_vertices)&&cfg.arena_vertices.length) {
    ctx.beginPath();
    for (let i=0;i<cfg.arena_vertices.length;i++) {
      const wx=left+cfg.arena_vertices[i][0]*scale;
      const wy=bottom-cfg.arena_vertices[i][1]*scale;
      i?ctx.lineTo(wx,wy):ctx.moveTo(wx,wy);
    }
    ctx.closePath();
    ctx.fillStyle="#161c24"; ctx.fill();
  }
  ctx.save();
  if (hexRadius&&territoryBoard) {
    ctx.translate(left,top); ctx.scale(geometryRatio,geometryRatio); ctx.clip(territoryBoard);
    ctx.scale(1/geometryRatio,1/geometryRatio); ctx.translate(-left,-top);
  }
  else if (hexRadius) territoryBoardPath(ctx,left,top,cfg.world_width*scale,cfg.world_height*scale);
  else if (hexArena) arenaPath(ctx,left,top,cfg.world_width*scale,cfg.world_height*scale);
  else { ctx.beginPath(); ctx.rect(left,top,cfg.world_width*scale,cfg.world_height*scale); }
  if (!(hexRadius&&territoryBoard)) ctx.clip();
  ctx.fillStyle="#1b222c"; ctx.fillRect(left,top,cfg.world_width*scale,cfg.world_height*scale);
  if (showTerritory) {
    updateTerritory(lower,worldWidth,worldHeight);
    ctx.drawImage(territoryCanvas,left,top,cfg.world_width*scale,cfg.world_height*scale);
  }
  if (cfg.river_width>0) {
    const x=left+(cfg.world_width-cfg.river_width)*.5*scale, y0=(cfg.world_height-cfg.bridge_width)*.5;
    ctx.fillStyle="#1e465f"; ctx.fillRect(x,bottom-y0*scale,cfg.river_width*scale,y0*scale);
    ctx.fillRect(x,top,cfg.river_width*scale,y0*scale);
  }
  ctx.restore();
  if (hexRadius&&strongpointCells.length) {
    ctx.save(); ctx.translate(left,top); ctx.scale(geometryRatio,geometryRatio);
    ctx.lineWidth=Math.max(1.5*dpr,2)/geometryRatio;
    const baseCells=Array.isArray(cfg.team_base_cells)?cfg.team_base_cells:null;
    const drawCell=cell=>{
      if (territoryPaths.length) { ctx.fill(territoryPaths[cell]); ctx.stroke(territoryPaths[cell]); }
      else { territoryHexPath(ctx,territoryHexes[cell],worldWidth,worldHeight); ctx.fill(); ctx.stroke(); }
    };
    if (baseCells) {
      // Each base is tinted in its OWNER's color: defend your color,
      // attack theirs. team_base_cells[0] is blue's own base.
      ctx.fillStyle="rgba(53,167,255,.12)"; ctx.strokeStyle="#35a7ff";
      for (const cell of baseCells[0]) drawCell(cell);
      ctx.fillStyle="rgba(255,77,95,.12)"; ctx.strokeStyle="#ff4d5f";
      for (const cell of baseCells[1]) drawCell(cell);
    } else {
      ctx.fillStyle="rgba(255,196,64,.10)"; ctx.strokeStyle="#ffc440";
      for (const cell of strongpointCells) drawCell(cell);
    }
    ctx.restore();
  }
  ctx.strokeStyle="#54637a"; ctx.lineWidth=Math.max(1,dpr);
  if (!hexRadius) {
    if (hexArena) arenaPath(ctx,left,top,cfg.world_width*scale,cfg.world_height*scale);
    else { ctx.beginPath(); ctx.rect(left,top,cfg.world_width*scale,cfg.world_height*scale); }
    ctx.stroke();
  }
  const radius=Math.max(2*dpr,cfg.soldier_radius*scale);
  if (showTrails) {
    ctx.lineWidth=Math.max(1,dpr*.8);
    const back=Math.max(0,lower-10);
    for (let team=0;team<2;team++) {
      ctx.strokeStyle=team===0?"rgba(53,167,255,.3)":"rgba(255,77,95,.3)";
      ctx.beginPath();
      for (let i=0;i<soldierCount;i++) if (teams[i]===team && healths[lower*soldierCount+i]>0) {
        let p=(back*soldierCount+i)*2;
        ctx.moveTo(left+positions[p]*cfg.world_width*scale/quantizedMax,bottom-positions[p+1]*cfg.world_height*scale/quantizedMax);
        for (let f=back+2;f<=lower;f+=2) {
          p=(f*soldierCount+i)*2;
          ctx.lineTo(left+positions[p]*cfg.world_width*scale/quantizedMax,bottom-positions[p+1]*cfg.world_height*scale/quantizedMax);
        }
      }
      ctx.stroke();
    }
  }
  const fadeFrames=15;
  ctx.lineWidth=Math.max(1,dpr);
  for (let i=0;i<soldierCount;i++) {
    const df=deathFrame[i];
    if (df===65535||df>lower||lower-df>=fadeFrames) continue;
    const age=(cursor-df)/fadeFrames, alpha=Math.max(0,.7*(1-age));
    if (alpha<=0) continue;
    ctx.strokeStyle=(teams[i]===0?"rgba(53,167,255,":"rgba(255,77,95,")+alpha.toFixed(3)+")";
    ctx.beginPath(); ctx.arc(left+deathX[i]*scale,bottom-deathY[i]*scale,radius*(1+age*1.5),0,2*Math.PI); ctx.stroke();
  }
  let alive0=0, alive1=0;
  const lowerBase=lower*soldierCount, upperBase=upper*soldierCount;
  for (let i=0;i<soldierCount;i++) {
    const lowerIndex=lowerBase+i, upperIndex=upperBase+i, output=i*4;
    const health=(healths[lowerIndex]+(healths[upperIndex]-healths[lowerIndex])*amount)/quantizedMax;
    screenState[output+3]=health;
    if (health<=0) continue;
    if (teams[i]===0) alive0++; else alive1++;
    const p0=lowerIndex*2, p1=upperIndex*2;
    screenState[output]=left+(positions[p0]+(positions[p1]-positions[p0])*amount)*cfg.world_width*scale/quantizedMax;
    screenState[output+1]=bottom-(positions[p0+1]+(positions[p1+1]-positions[p0+1])*amount)*cfg.world_height*scale/quantizedMax;
    const angle0=angles[lowerIndex]*angleScale, angle1=angles[upperIndex]*angleScale;
    screenState[output+2]=angle0+Math.atan2(Math.sin(angle1-angle0),Math.cos(angle1-angle0))*amount;
  }
  ctx.strokeStyle="#071116"; ctx.lineWidth=Math.max(1,radius*.14);
  for (let team=0;team<2;team++) {
    ctx.fillStyle=team===0?"#35a7ff":"#ff4d5f"; ctx.beginPath();
    for (let i=0;i<soldierCount;i++) if (teams[i]===team && screenState[i*4+3]>0) {
      const x=screenState[i*4], y=screenState[i*4+1];
      ctx.moveTo(x+radius,y); ctx.arc(x,y,radius,0,2*Math.PI);
    }
    ctx.fill(); ctx.stroke();
  }
  const attackRadius=radius*1.17;
  ctx.strokeStyle="#ffe08a"; ctx.lineWidth=Math.max(1.2*dpr,radius*.25); ctx.beginPath();
  for (let i=0;i<soldierCount;i++) if (screenState[i*4+3]>0) {
    const x=screenState[i*4], y=screenState[i*4+1], start=-screenState[i*4+2]-Math.PI/3;
    ctx.moveTo(x+Math.cos(start)*attackRadius,y+Math.sin(start)*attackRadius);
    ctx.arc(x,y,attackRadius,start,start+2*Math.PI/3);
  }
  ctx.stroke();
  const healthRadius=radius*.72;
  ctx.strokeStyle="#d9f2dc"; ctx.lineWidth=Math.max(1*dpr,radius*.15); ctx.beginPath();
  for (let i=0;i<soldierCount;i++) {
    const health=screenState[i*4+3]; if (health<=0 || health>=.99999) continue;
    const x=screenState[i*4], y=screenState[i*4+1];
    ctx.moveTo(x+healthRadius,y); ctx.arc(x,y,healthRadius,0,2*Math.PI*health);
  }
  ctx.stroke();
  if (selected>=0) {
    const health=screenState[selected*4+3];
    if (health>0) {
      const x=screenState[selected*4], y=screenState[selected*4+1];
      ctx.strokeStyle="#ffffff"; ctx.lineWidth=Math.max(1.2*dpr,radius*.2);
      ctx.beginPath(); ctx.arc(x,y,radius*1.45,0,2*Math.PI); ctx.stroke();
      ctx.setLineDash([6*dpr,5*dpr]); ctx.strokeStyle="rgba(255,255,255,.45)"; ctx.lineWidth=Math.max(1,dpr);
      ctx.beginPath(); ctx.arc(x,y,perceptionRadius*scale,0,2*Math.PI); ctx.stroke(); ctx.setLineDash([]);
      const facing=-screenState[selected*4+2];
      ctx.fillStyle=teams[selected]===0?"rgba(53,167,255,.22)":"rgba(255,77,95,.22)";
      ctx.beginPath(); ctx.moveTo(x,y); ctx.arc(x,y,perceptionRadius*scale*.5,facing-Math.PI/3,facing+Math.PI/3); ctx.closePath(); ctx.fill();
      const degrees=((Math.round(screenState[selected*4+2]*180/Math.PI)%360)+360)%360;
      inspect.className=teams[selected]===0?"blue":"red";
      inspect.textContent=(teams[selected]===0?"blue":"red")+" #"+selected+" · hp "+Math.round(health*100)+"% · facing "+degrees+"°";
      inspect.hidden=false;
    } else {
      inspect.className=teams[selected]===0?"blue":"red";
      inspect.textContent=(teams[selected]===0?"blue":"red")+" #"+selected+" · down";
      inspect.hidden=false;
    }
  } else inspect.hidden=true;
  slider.value=Math.min(cursor,lastFrame);
  const ending=lower===lastFrame&&Number.isInteger(replay.winner)?(replay.winner<0?" · draw":" · "+(replay.winner===0?"blue":"red")+" wins"):"";
  setText(timeText,"t="+(lower*cfg.decision_dt).toFixed(1)+"s · "+lower+"/"+lastFrame+ending);
  setText(chip0,"● "+alive0); setText(chip1,"● "+alive1);
  const shareKey=scoreShare0.toFixed(3)+":"+scoreShare1.toFixed(3);
  if (scoreKey!==shareKey) {
    scoreKey=shareKey;
    scoreBlue.style.width=(scoreShare0*100).toFixed(1)+"%";
    scoreRed.style.width=(scoreShare1*100).toFixed(1)+"%";
    scorebar.title=territoryText+" | winner = sign of the time-integral shown as the second number";
  }
  const advantage=scoreShare0-scoreShare1;
  let deltaText="lead "+(advantage>=0?"+":"")+advantage.toFixed(3);
  let decisive=advantage;
  if (meanAdvantage) {
    const banked=meanAdvantage[lower];
    deltaText+=" · banked "+(banked>=0?"+":"")+banked.toFixed(3);
    decisive=banked;
  }
  setText(deltaChip,deltaText);
  deltaChip.style.color=decisive>0.001?"var(--blue)":decisive<-0.001?"var(--red)":"";
  if (lower===lastFrame&&Number.isInteger(replay.winner)) {
    const verdict=replay.winner<0?"DRAW":replay.winner===0?"BLUE WINS":"RED WINS";
    ctx.font="bold "+Math.round(26*dpr)+"px ui-monospace,Menlo,Consolas,monospace"; ctx.textAlign="center";
    ctx.fillStyle=replay.winner===0?"#35a7ff":replay.winner===1?"#ff4d5f":"#dddddd";
    ctx.globalAlpha=.92; ctx.fillText(verdict,width/2,Math.max(top,20*dpr)+34*dpr);
    ctx.globalAlpha=1; ctx.textAlign="left";
  }
}

function animate(now) {
  animationRequest=0;
  if (document.hidden) return;
  const elapsed=Math.min(now-previous,100); previous=now;
  if (playing) {
    cursor+=elapsed*Number(speed.value)/1000/cfg.decision_dt;
    if (cursor>=lastFrame) { cursor=lastFrame; setPlaying(false); }
    dirty=true;
  }
  if (dirty && (!playing || now-lastDraw>=targetFrameMs)) { draw(); dirty=false; lastDraw=now; }
  if (playing||dirty) scheduleDraw();
}
function scheduleDraw() {
  if (!animationRequest&&!document.hidden) animationRequest=requestAnimationFrame(animate);
}
function invalidate() { dirty=true; scheduleDraw(); }
function setPlaying(value) { playing=value && lastFrame>0; setText(play,playing?"❚❚":"▶︎"); if (playing) scheduleDraw(); }
function toggle() { if (!playing && cursor>=lastFrame) cursor=0; setPlaying(!playing); previous=performance.now(); invalidate(); }
function toggleTerritory() {
  showTerritory=!showTerritory;
  territoryButton.classList.toggle("on",showTerritory);
  scorebar.classList.toggle("off",!showTerritory);
  invalidate();
}
function toggleTrails() {
  showTrails=!showTrails;
  trailsButton.classList.toggle("on",showTrails);
  invalidate();
}
function resetView() { zoom=1; camX=cfg.world_width/2; camY=cfg.world_height/2; invalidate(); }
function zoomAt(screenX,screenY,factor) {
  const worldX=(screenX-viewLeft)/viewScale, worldY=(viewBottom-screenY)/viewScale;
  zoom=Math.max(1,Math.min(16,zoom*factor));
  const scale=viewBase*zoom;
  camX=worldX-(screenX-canvas.width/2)/scale;
  camY=worldY+(screenY-canvas.height/2)/scale;
  if (zoom===1) { camX=cfg.world_width/2; camY=cfg.world_height/2; }
  invalidate();
}
canvas.addEventListener("wheel",e=>{
  e.preventDefault();
  const rect=canvas.getBoundingClientRect();
  zoomAt((e.clientX-rect.left)*viewDpr,(e.clientY-rect.top)*viewDpr,Math.exp(-e.deltaY*.0015));
},{passive:false});
const pointers=new Map();
let dragDistance=0, pinchDistance=0;
canvas.addEventListener("pointerdown",e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragDistance=0;
  if (pointers.size===2) {
    const p=[...pointers.values()];
    pinchDistance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  }
});
canvas.addEventListener("pointermove",e=>{
  const entry=pointers.get(e.pointerId); if (!entry) return;
  const dx=e.clientX-entry.x, dy=e.clientY-entry.y;
  entry.x=e.clientX; entry.y=e.clientY;
  if (pointers.size===1) {
    dragDistance+=Math.hypot(dx,dy);
    if (zoom>1) { camX-=dx*viewDpr/viewScale; camY+=dy*viewDpr/viewScale; invalidate(); }
  } else if (pointers.size===2) {
    dragDistance=100;
    const p=[...pointers.values()];
    const distance=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
    if (pinchDistance>0) {
      const rect=canvas.getBoundingClientRect();
      zoomAt(((p[0].x+p[1].x)/2-rect.left)*viewDpr,((p[0].y+p[1].y)/2-rect.top)*viewDpr,distance/pinchDistance);
    }
    pinchDistance=distance;
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  pinchDistance=0;
  if (pointers.size===0 && dragDistance<5) {
    const rect=canvas.getBoundingClientRect();
    const screenX=(e.clientX-rect.left)*viewDpr, screenY=(e.clientY-rect.top)*viewDpr;
    let best=-1, bestDistance=Math.max(24*viewDpr,cfg.soldier_radius*viewScale*2.5);
    for (let i=0;i<soldierCount;i++) if (screenState[i*4+3]>0) {
      const separation=Math.hypot(screenState[i*4]-screenX,screenState[i*4+1]-screenY);
      if (separation<bestDistance) { best=i; bestDistance=separation; }
    }
    selected=best;
    invalidate();
  }
}
canvas.addEventListener("pointerup",endPointer);
canvas.addEventListener("pointercancel",endPointer);
trailsButton.onclick=toggleTrails;
play.onclick=toggle;
current.onclick=()=>{ if (latestUpdate!==null) location.replace("update-"+latestUpdate+".html"); };
updates.onchange=()=>location.replace("update-"+updates.value+".html");
territoryButton.onclick=toggleTerritory;
slider.oninput=()=>{ cursor=Number(slider.value); setPlaying(false); invalidate(); };
document.onkeydown=e=>{
  if(e.key===" "){e.preventDefault();toggle();}
  else if(e.key.toLowerCase()==="t")toggleTerritory();
  else if(e.key.toLowerCase()==="r")toggleTrails();
  else if(e.key==="0")resetView();
  else if(e.key==="ArrowLeft"||e.key==="ArrowRight") {
    e.preventDefault(); setPlaying(false);
    cursor=Math.max(0,Math.min(lastFrame,Math.floor(cursor)+(e.key==="ArrowLeft"?-1:1))); invalidate();
  }
};
document.addEventListener("visibilitychange",()=>{
  previous=performance.now();
  if (document.hidden&&animationRequest) { cancelAnimationFrame(animationRequest); animationRequest=0; }
  else invalidate();
});
const resized=()=>{ territoryKey=""; territoryGeometryKey=""; invalidate(); };
if (window.ResizeObserver) new ResizeObserver(resized).observe(canvas);
else window.addEventListener("resize",resized);
if (mobile) { setText(current,"current"); setText(territoryButton,"map"); }
setPlaying(playing);
invalidate();
</script>
